<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Městská policie – Náborové řízení</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f4f7;
      margin: 0;
    }

    header {
      background: #0b2e4a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
    }

    h3 {
      color: #0b2e4a;
      border-bottom: 1px solid #ddd;
      padding-bottom: 5px;
      margin-top: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      background: #0b2e4a;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #123d63;
    }

    .info {
      font-size: 13px;
      color: #444;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>MĚSTSKÁ POLICIE – NÁBOROVÉ ŘÍZENÍ</h1>
</header>

<div class="container">

<div class="info">
Tento formulář slouží k výběrovému řízení k Městské policii. Uveďte pravdivé a úplné informace. Nepravdivé údaje mohou vést k okamžitému vyřazení.
</div>

<form action="https://formspree.io/f/mjglbqqa" method="POST">

  <h3>IC – OSOBNÍ ÚDAJE</h3>

  <label>Jméno a příjmení</label>
  <input type="text" name="jmeno" required>

  <label>Datum narození</label>
  <input type="date" name="datum_narozeni" required>

  <label>Státní příslušnost</label>
  <input type="text" name="statni_prislusnost">

  <label>Trvalé bydliště</label>
  <input type="text" name="bydliste">

  <label>Rodinný stav</label>
  <input type="text" name="rodinny_stav">

  <h3>IC – VZDĚLÁNÍ A PRAXE</h3>

  <label>Nejvyšší dosažené vzdělání</label>
  <input type="text" name="vzdelani">

  <label>Předchozí zaměstnání</label>
  <textarea name="zamestnani"></textarea>

  <label>Máte zkušenosti s bezpečnostními složkami?</label>
  <textarea name="bezpecnostni_zkusenosti"></textarea>

  <h3>IC – MOTIVACE</h3>

  <label>Proč chcete vstoupit k Městské policii?</label>
  <textarea name="motivace" required></textarea>

  <label>Co pro vás znamená služba u Městské policie?</label>
  <textarea name="vyznam_sluzby"></textarea>

  <label>Jaké jsou vaše silné a slabé stránky?</label>
  <textarea name="silne_slabse"></textarea>

  <h3>IC – KRIZOVÉ SITUACE</h3>

  <label>Jak byste postupoval při konfliktu na veřejnosti?</label>
  <textarea name="konflikt"></textarea>

  <label>Jak byste reagoval na agresivního občana?</label>
  <textarea name="agrese"></textarea>

  <label>Jak byste postupoval při podezření na trestný čin?</label>
  <textarea name="trestny_cin"></textarea>

  <h3>BEZÚHONNOST</h3>

  <label>Byl jste někdy trestně stíhán?</label>
  <select name="trestni_stihani" required>
    <option value="ne">Ne</option>
    <option value="ano">Ano</option>
  </select>

  <label>Byl jste někdy odsouzen?</label>
  <select name="odsouzeni" required>
    <option value="ne">Ne</option>
    <option value="ano">Ano</option>
  </select>

  <label>Máte přestupky v evidenci?</label>
  <textarea name="prestupky"></textarea>

  <h3>OOC INFORMACE</h3>

  <label>Věk (OOC)</label>
  <input type="number" name="vek" required>

  <label>Zkušenosti s RP</label>
  <textarea name="rp_zkusenosti"></textarea>

  <label>Jak dlouho hrajete RP?</label>
  <input type="text" name="delka_rp">

  <label>Kolik hodin týdně hrajete RP?</label>
  <input type="text" name="cas_rp">

  <label>Máte zkušenosti s policejními RP složkami?</label>
  <textarea name="slozky"></textarea>

  <label>Discord kontakt</label>
  <input type="text" name="discord" required>

  <h3>SOUHLAS</h3>

  <label>Potvrzujete pravdivost všech údajů?</label>
  <select name="pravdivost" required>
    <option value="ano">Ano</option>
    <option value="ne">Ne</option>
  </select>

  <label>Souhlasíte s pravidly Městské policie a serveru?</label>
  <select name="souhlas" required>
    <option value="ano">Ano</option>
    <option value="ne">Ne</option>
  </select>

  <button type="submit">ODESLAT PŘIHLÁŠKU</button>

</form>

</div>

</body>
</html>
